name: TiltTrainer verification
on:
  push:
    branches: [main, feature/lab-2]
  pull_request:
    branches: [main]
jobs:
  firmware-and-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: make build
      - run: make test-linux
      - run: make coverage-linux
      - run: python3 tools/check_coverage.py tests/coverage/Linux-x86_64
      - run: make sanitize
